name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'course/**']

jobs:
  # ==========================================
  # 前端检查
  # ==========================================
  frontend-lint:
    name: 前端 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: cd apps/web && npm run lint

      - name: Prettier check
        run: cd apps/web && npm run format:check

      - name: TypeScript type check
        run: cd apps/web && npm run type-check

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: [frontend-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: cd apps/web && npm run build

  # ==========================================
  # 后端检查
  # ==========================================
  backend-lint:
    name: 后端 Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Ruff check
        run: ruff check apps/api/ services/ scripts/check_wallet_report.py scripts/wallet_report/

      - name: Ruff format check
        run: ruff format --check apps/api/ services/ scripts/check_wallet_report.py scripts/wallet_report/

  # ==========================================
  # 钱包数量、账户身份与报告缓存回归
  # ==========================================
  wallet-report:
    name: Wallet report regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Install isolated-test Redis runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Offline suites and real Redis publication
        run: python scripts/check_wallet_report.py --out .wallet-report-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-report-results
          path: .wallet-report-results
          include-hidden-files: true

  # ==========================================
  # Commitlint 检查
  # ==========================================
  commitlint:
    name: Commit 信息检查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Commitlint
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
